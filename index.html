<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <meta name="color-scheme" content="dark" />
  <title>SnapTerm — VS Code terminal screenshots</title>
  <meta name="description" content="Generate pixel-accurate VS Code terminal screenshots from pasted text." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">

  <style>
    /* ============================================================
     TOKENS
     ============================================================ */
    :root {
      --w: #f5f5f5;
      --ink: rgba(255, 255, 255, 0.92);
      --ink-2: rgba(255, 255, 255, 0.70);
      --ink-3: rgba(255, 255, 255, 0.45);
      --ink-4: rgba(255, 255, 255, 0.30);
      --ink-5: rgba(255, 255, 255, 0.16);
      --line: rgba(255, 255, 255, 0.08);
      --line-2: rgba(255, 255, 255, 0.12);
      --glass: linear-gradient(145deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
      --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      --mono: 'Space Mono', ui-monospace, monospace;
      --tech: 'Orbitron', sans-serif;
      --ui: 'Inter', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0a0a0b;
      color: #fff;
      font-family: var(--ui);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ============================================================
     BACKDROP — gradient + radial glow + dot grid
     ============================================================ */
    .stage-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(160deg, #1c1c1e 0%, #121214 50%, #0a0a0b 100%);
    }

    .stage-bg::before {
      content: '';
      position: absolute;
      top: -10%;
      right: -5%;
      width: 55%;
      height: 65%;
      background: radial-gradient(ellipse, rgba(255, 255, 255, 0.045) 0%, transparent 70%);
      pointer-events: none;
    }

    .stage-bg::after {
      content: '';
      position: absolute;
      bottom: -15%;
      left: -10%;
      width: 50%;
      height: 55%;
      background: radial-gradient(ellipse, rgba(120, 160, 255, 0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    .dot-grid {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image: radial-gradient(rgba(255, 255, 255, 0.075) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* ============================================================
     SHELL
     ============================================================ */
    .app {
      position: relative;
      z-index: 2;
      height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      padding: 26px 34px 20px;
      gap: 18px;
    }

    /* ---------- Topbar ---------- */
    .topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      font-family: var(--tech);
      font-weight: 900;
      font-size: 19px;
      letter-spacing: 0.14em;
      color: #fff;
      line-height: 1;
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 34px;
    }

    .nav-item {
      position: relative;
      background: none;
      border: none;
      padding: 0 0 7px;
      font: 600 10px/1 var(--ui);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-4);
      cursor: pointer;
      transition: color .2s;
    }

    .nav-item::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 1.5px;
      border-radius: 1px;
      background: var(--w);
      opacity: 0;
      transition: opacity .2s;
    }

    .nav-item:hover {
      color: #fff;
    }

    .nav-item:hover::after {
      opacity: .45;
    }

    .nav-item.active {
      color: #fff;
    }

    .nav-item.active::after {
      opacity: 1;
    }

    .dots {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
    }

    .dots span:first-child {
      background: rgba(255, 255, 255, 0.8);
    }

    /* ---------- Stage ---------- */
    .stage {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(320px, 390px) minmax(0, 1fr);
      gap: 22px;
    }

    .col-editor,
    .col-preview {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    .col-editor {
      overflow-y: auto;
      padding-right: 3px;
    }

    /* ---------- Hero ---------- */
    .hero {
      flex-shrink: 0;
      padding: 2px 0 4px;
    }

    .hero h1 {
      margin: 0;
      font-family: var(--tech);
      font-weight: 900;
      font-size: 21px;
      line-height: 1.08;
      letter-spacing: -0.005em;
      color: #fff;
    }

    .hero h1 span {
      display: block;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.01em;
      color: rgba(255, 255, 255, 0.16);
      margin-top: 2px;
    }

    /* ============================================================
     CARDS
     ============================================================ */
    .card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 15px;
      min-height: 0;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--card-shadow);
    }

    .card-output {
      flex: 1 1 auto;
      min-height: 150px;
    }

    .card-prompt,
    .card-controls {
      flex: 0 0 auto;
    }

    .label {
      flex-shrink: 0;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-4);
    }

    /* ---------- Inputs ---------- */
    textarea,
    input[type=text] {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      padding: 12px 14px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.65;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    textarea {
      resize: none;
      flex: 1;
      min-height: 0;
    }

    input[type=text] {
      min-height: 46px;
    }

    textarea::placeholder,
    input[type=text]::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    textarea:focus,
    input[type=text]:focus {
      border-color: rgba(255, 255, 255, 0.22);
      background: rgba(0, 0, 0, 0.5);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.045);
    }

    /* ============================================================
     CONTROLS
     ============================================================ */
    .ctl {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ctl+.ctl {
      margin-top: 2px;
    }

    .ctl-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .ctl-name {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
    }

    .ctl-right {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .val {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--line-2);
      background: rgba(255, 255, 255, 0.04);
      border-radius: 9999px;
      padding: 3px 9px;
      min-width: 56px;
      text-align: center;
    }

    .rst {
      width: 20px;
      height: 20px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid var(--line-2);
      background: rgba(255, 255, 255, 0.03);
      border-radius: 50%;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      transition: all .15s;
      flex-shrink: 0;
    }

    .rst svg {
      width: 10px;
      height: 10px;
      fill: currentColor;
    }

    .rst:hover:not(:disabled) {
      color: #0a0a0b;
      background: var(--w);
      border-color: var(--w);
      transform: rotate(-30deg);
    }

    .rst:active:not(:disabled) {
      transform: scale(.9);
    }

    .rst:disabled {
      opacity: .25;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* ---------- Range ---------- */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--w);
      border: none;
      cursor: pointer;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05), 0 2px 8px rgba(0, 0, 0, 0.5);
      transition: box-shadow .2s, transform .12s;
    }

    input[type=range]:hover::-webkit-slider-thumb {
      box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.10), 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    input[type=range]:active::-webkit-slider-thumb {
      transform: scale(1.15);
    }

    input[type=range]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--w);
      border: none;
      cursor: pointer;
    }

    input[type=range]::-moz-range-track {
      height: 2px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
    }

    /* ---------- Presets ---------- */
    .presets {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .preset {
      font: 700 9px/1 var(--ui);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 11px;
      border-radius: 9999px;
      border: 1px solid var(--line-2);
      background: rgba(255, 255, 255, 0.03);
      color: var(--ink-3);
      cursor: pointer;
      transition: all .15s;
    }

    .preset:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
    }

    .preset.active {
      background: var(--w);
      color: #0a0a0b;
      border-color: var(--w);
    }

    /* ---------- Checkbox ---------- */
    .check {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      user-select: none;
    }

    input[type=checkbox] {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.35);
      cursor: pointer;
      position: relative;
      transition: all .15s;
    }

    input[type=checkbox]:checked {
      background: var(--w);
      border-color: var(--w);
    }

    input[type=checkbox]:checked::after {
      content: '';
      position: absolute;
      left: 4.5px;
      top: 1.5px;
      width: 4px;
      height: 8px;
      border: solid #0a0a0b;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    /* ============================================================
     PREVIEW
     ============================================================ */
    .preview-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      background: rgba(0, 0, 0, 0.28);
      overflow: hidden;
    }

    .preview-stage::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 25%, transparent 78%);
      mask-image: radial-gradient(ellipse at 50% 40%, #000 25%, transparent 78%);
    }

    .preview-scroll {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 26px;
    }

    .canvas-wrap {
      position: relative;
      display: inline-block;
      max-width: 100%;
      line-height: 0;
    }

    #termCanvas {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    /* Mobile crop peek */
    .canvas-wrap.cropping {
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    .canvas-wrap.cropping #termCanvas {
      max-width: none;
      border-radius: 8px 0 0 8px;
    }

    .canvas-wrap.cropping .crop-overlay {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: none;
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
    }

    .crop-overlay {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(1px);
      pointer-events: none;
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
      display: none;
    }

    .crop-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 0;
      border-left: 1.5px dashed rgba(255, 255, 255, 0.65);
      pointer-events: none;
      display: none;
    }

    /* ---------- Info pills ---------- */
    .info-row {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .info-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.035);
      border-radius: 9999px;
      backdrop-filter: blur(4px);
    }

    .info-pill span {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-4);
    }

    .info-pill b {
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
    }

    /* ---------- Buttons ---------- */
    .actions {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font: 700 11px/1 var(--ui);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 14px 18px;
      border-radius: 10px;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all .18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.18);
    }

    .btn-solid {
      flex: 1;
      background: var(--w);
      color: #0a0a0b;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }

    .btn-solid:hover {
      background: #fff;
      transform: translateY(-1px);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
    }

    .btn-solid:active {
      transform: translateY(0);
    }

    .btn-ghost {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, 0.03);
      border-color: var(--line-2);
      color: var(--ink-2);
    }

    .btn-ghost:hover {
      background: var(--w);
      border-color: var(--w);
      color: #0a0a0b;
    }

    .btn-ghost:active {
      transform: translateY(1px);
    }

    /* ---------- Status bar ---------- */
    .statusbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: 2px;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      animation: pulse-dark 2.5s ease-in-out infinite;
    }

    @keyframes pulse-dark {

      0%,
      100% {
        opacity: 1;
        box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.45);
      }

      50% {
        opacity: .75;
        box-shadow: 0 0 0 6px rgba(52, 211, 153, 0);
      }
    }

    .status-txt {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
    }

    .status-sep {
      color: rgba(255, 255, 255, 0.15);
      font-size: 10px;
    }

    .status-ver {
      font-family: var(--mono);
      font-size: 9.5px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.28);
    }

    .status-right {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.22);
    }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(14px);
      padding: 12px 22px;
      background: rgba(20, 20, 22, 0.94);
      border: 1px solid var(--line-2);
      border-radius: 9999px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #fff;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s, transform .22s;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6);
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.success {
      border-color: rgba(52, 211, 153, 0.5);
    }

    .toast.error {
      border-color: rgba(248, 113, 113, 0.5);
    }

    /* ---------- Scrollbars ---------- */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* ============================================================
     DESKTOP ≥ 1024px
     ============================================================ */
    @media (min-width:1024px) {
      .tab {
        display: none;
      }
    }

    /* ============================================================
     MOBILE ≤ 1023px
     ============================================================ */
    @media (max-width:1023px) {
      .app {
        padding: 18px 18px 14px;
        gap: 14px;
      }

      .brand {
        font-size: 16px;
      }

      .nav-links {
        gap: 20px;
      }

      .nav-item {
        letter-spacing: 0.12em;
        font-size: 9.5px;
      }

      .act {
        display: none;
      }

      .stage {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .col-editor,
      .col-preview {
        display: none;
        flex: 1;
        min-height: 0;
      }

      .col-editor.active,
      .col-preview.active {
        display: flex;
      }

      .col-editor {
        overflow-y: auto;
        padding-right: 2px;
      }

      .hero h1 {
        font-size: 24px;
      }

      .hero h1 span {
        font-size: 15px;
      }

      .card-output {
        flex: 0 0 auto;
      }

      .card-output textarea {
        height: 190px;
        flex: none;
      }

      .preview-scroll {
        padding: 16px;
      }

      .btn {
        padding: 13px 15px;
        font-size: 10.5px;
        letter-spacing: 0.1em;
      }

      .btn-ghost span.txt {
        display: none;
      }

      .info-pill {
        padding: 6px 11px;
      }
    }

    @media (max-width:420px) {
      .app {
        padding: 14px 14px 12px;
      }

      .nav-links {
        gap: 14px;
      }

      .brand {
        font-size: 14px;
        letter-spacing: 0.1em;
      }

      .dots {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="stage-bg"></div>
  <div class="dot-grid"></div>

  <div class="app">

    <!-- ===================== TOPBAR ===================== -->
    <nav class="topbar">
      <div class="brand">SNAPTERM</div>

      <div class="nav-links" id="tabs">
        <button class="nav-item tab" data-tab="preview" type="button">Preview</button>
        <button class="nav-item tab" data-tab="editor" type="button">Editor</button>
        <button class="nav-item act" data-action="export" type="button">Export</button>
        <button class="nav-item act" data-action="copy" type="button">Copy</button>
        <button class="nav-item act" data-action="reset" type="button">Reset</button>
      </div>

      <div class="dots"><span></span><span></span><span></span></div>
    </nav>

    <!-- ===================== STAGE ===================== -->
    <main class="stage">

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      "use strict";

      /* ============================================================
         DEFAULTS
         ============================================================ */
      var DEFAULT_PROMPT = 'PS D:\\TEJ\\Study\\.INFORMATION TECHNOLOGY\\sem 3\\CODE\\FDS tejas\\exp 4> cd "d:\\TEJ\\Study\\.INFORMATION TECHNOLOGY\\sem 3\\CODE\\FDS tejas\\exp 4" ; if ($?) { g++ exp4_a.cpp -o exp4_a } ; if ($?) { .\\exp4_a }';

      var DEFAULT_OUTPUT = [
        "===== MENU =====",
        "[1] Insert at Start",
        "[2] Insert at End",
        "[3] Insert at Position",
        "[4] Delete at Start",
        "[5] Delete at End",
        "[6] Delete at Position",
        "[7] Display",
        "[8] Exit",
        "Enter your choice: "
      ].join("\n");

      /* ============================================================
         CANVAS GEOMETRY  (unchanged — controls screenshot fidelity)
         ============================================================ */
      var JPG_QUALITY = 0.95;
      var HEADER_H = 35;
      var GUTTER = 22;
      var PAD_L = 6;
      var PAD_R = 12;
      var PAD_T = 4;
      var PAD_B = 8;

      var MONO = '"Cascadia Mono", "Cascadia Code", Consolas, "Courier New", monospace';
      var UI_FONT = '13px "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif';

      var C_PANEL = "#181818";
      var C_BORDER = "#2b2b2b";
      var C_TAB = "#9d9d9d";
      var C_TAB_ON = "#e7e7e7";
      var C_TAB_BG = "#2b2b2b";
      var C_TEXT = "#cccccc";
      var C_ICON = "#c8c8c8";
      var C_DOT = "#8a8a8a";

      var MOBILE_BP = 1023;

      /* ============================================================
         ELEMENTS
         ============================================================ */
      function $(id) { return document.getElementById(id); }
      function isMobile() { return window.matchMedia("(max-width: " + MOBILE_BP + "px)").matches; }

      var els = {
        tabs: $("tabs"),
        colEditor: $("colEditor"),
        colPreview: $("colPreview"),

        outputFull: $("outputFull"),
        promptInput: $("promptInput"),

        fontSize: $("fontSize"),
        panelWidth: $("panelWidth"),
        bottomSpace: $("bottomSpace"),
        cropRight: $("cropRight"),
        cursor: $("cursor"),

        fsVal: $("fsVal"),
        pwVal: $("pwVal"),
        bsVal: $("bsVal"),
        crVal: $("crVal"),

        dimInfo: $("dimInfo"),
        lineInfo: $("lineInfo"),
        cropInfo: $("cropInfo"),

        presets: $("presets"),
        dl: $("dl"),
        copyBtn: $("copyBtn"),
        resetBtn: $("resetBtn"),

        canvasWrap: $("canvasWrap"),
        canvasScroll: document.querySelector(".preview-scroll"),
        cropOverlay: $("cropOverlay"),
        cropLine: $("cropLine"),

        toast: $("toast")
      };

      var canvas = $("termCanvas");
      var ctx = canvas.getContext("2d");
      var meas = document.createElement("canvas").getContext("2d");

      var currentTab = isMobile() ? "preview" : "editor";

      /* ============================================================
         LAYOUT
         ============================================================ */
      function applyLayout() {
        var mobile = isMobile();

        var tabBtns = els.tabs.querySelectorAll(".tab");
        for (var i = 0; i < tabBtns.length; i++) {
          tabBtns[i].classList.toggle("active", tabBtns[i].dataset.tab === currentTab);
        }

        if (mobile) {
          els.colEditor.classList.toggle("active", currentTab === "editor");
          els.colPreview.classList.toggle("active", currentTab === "preview");
        } else {
          els.colEditor.classList.add("active");
          els.colPreview.classList.add("active");
        }
      }

      function switchTab(name) {
        currentTab = name;
        applyLayout();
      }

      window.addEventListener("resize", function () {
        applyLayout();
        updateCanvasDisplay(+els.panelWidth.value, +els.cropRight.value);
        updateCropOverlay(+els.cropRight.value);
      });

      /* ============================================================
         TOAST
         ============================================================ */
      var toastTimer = null;
      function showToast(msg, kind) {
        els.toast.textContent = msg;
        els.toast.className = "toast show" + (kind ? " " + kind : "");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          els.toast.className = "toast" + (kind ? " " + kind : "");
        }, 1800);
      }

      /* ============================================================
         TEXT WRAPPING
         ============================================================ */
      function wrapChars(text, maxChars) {
        var out = [];
        var paras = String(text)
          .replace(/\r\n?/g, "\n")
          .replace(/\t/g, "    ")
          .split("\n");

        for (var p = 0; p < paras.length; p++) {
          var para = paras[p];
          if (para.length === 0) { out.push(""); continue; }
          for (var i = 0; i < para.length; i += maxChars) {
            out.push(para.slice(i, i + maxChars));
          }
        }
        return out.length ? out : [""];
      }

      /* ============================================================
         DRAWING HELPERS
         ============================================================ */
      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function drawPlus(cx, cy) {
        var r = 5.5;
        ctx.beginPath();
        ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
        ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
        ctx.stroke();
      }

      function drawChevron(cx, cy, dir) {
        var w = 4.5, h = 2.5;
        var d = dir === "down" ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(cx - w, cy - h * d);
        ctx.lineTo(cx, cy + h * d);
        ctx.lineTo(cx + w, cy - h * d);
        ctx.stroke();
      }

      function drawClose(cx, cy) {
        var r = 4.5;
        ctx.beginPath();
        ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r);
        ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r);
        ctx.stroke();
      }

      function drawHeader(W) {
        ctx.font = UI_FONT;
        ctx.textBaseline = "middle";

        var tabs = [["Problems", false], ["Debug Console", false], ["Terminal", true]];
        var x = 0;
        for (var i = 0; i < tabs.length; i++) {
          var label = tabs[i][0];
          var active = tabs[i][1];
          var tw = ctx.measureText(label).width + 22;

          if (active) {
            ctx.fillStyle = C_TAB_BG;
            roundRect(x + 3, 5, tw - 6, HEADER_H - 10, 5);
            ctx.fill();
          }
          ctx.fillStyle = active ? C_TAB_ON : C_TAB;
          ctx.fillText(label, x + 11, HEADER_H / 2 + 1);
          x += tw;
        }

        var iy = Math.round(HEADER_H / 2);
        ctx.strokeStyle = C_ICON;
        ctx.lineWidth = 1.2;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        var cx = W - 16;
        drawClose(cx, iy); cx -= 28;
        drawChevron(cx, iy, "up"); cx -= 28;
        drawChevron(cx, iy, "down"); cx -= 28;
        drawPlus(cx, iy);
      }

      /* ============================================================
         RESET BUTTON STATE
         ============================================================ */
      function refreshResetButtons() {
        var resets = document.querySelectorAll(".rst");
        for (var i = 0; i < resets.length; i++) {
          var btn = resets[i];
          var current = +els[btn.dataset.target].value;
          btn.disabled = (current === +btn.dataset.default);
        }
      }

      /* ============================================================
         CANVAS DISPLAY MODE
         ============================================================ */
      var CROP_PEEK_FRAC = 0.08;
      var CROP_PEEK_MIN = 22;
      var CROP_PEEK_MAX = 0.22;

      function updateCanvasDisplay(panelW, cropPct) {
        if (isMobile() && cropPct > 0) {
          els.canvasWrap.classList.add("cropping");

          var avail = els.canvasWrap.clientWidth || els.canvasScroll.clientWidth;
          var peek = Math.round(avail * CROP_PEEK_FRAC);
          if (peek < CROP_PEEK_MIN) peek = CROP_PEEK_MIN;
          if (peek > avail * CROP_PEEK_MAX) peek = Math.round(avail * CROP_PEEK_MAX);

          var visibleFrac = 1 - cropPct / 100;
          var w = Math.max((avail - peek) / visibleFrac, avail);

          canvas.style.width = Math.round(w) + "px";
          canvas.style.maxWidth = "none";
        } else {
          els.canvasWrap.classList.remove("cropping");
          canvas.style.width = panelW + "px";
          canvas.style.maxWidth = "";
        }
      }

      /* ============================================================
         CROP MARKER
         ============================================================ */
      function updateCropOverlay(cropPct) {
        if (cropPct <= 0) {
          els.cropOverlay.style.display = "none";
          els.cropLine.style.display = "none";
          return;
        }

        var wrapRect = els.canvasWrap.getBoundingClientRect();
        var canvasRect = canvas.getBoundingClientRect();

        if (!wrapRect.width || !canvasRect.width) {
          els.cropOverlay.style.display = "none";
          els.cropLine.style.display = "none";
          return;
        }

        var visibleFrac = 1 - cropPct / 100;
        var boundary = (canvasRect.left - wrapRect.left) + canvasRect.width * visibleFrac;
        var fromRight = wrapRect.width - boundary;
        if (fromRight < 0) fromRight = 0;
        if (fromRight > wrapRect.width) fromRight = wrapRect.width;

        els.cropOverlay.style.display = "block";
        els.cropOverlay.style.width = fromRight + "px";
        els.cropLine.style.display = "block";
        els.cropLine.style.right = fromRight + "px";
      }

      /* ============================================================
         RENDER
         ============================================================ */
      function render() {
        try {
          var fontSize = +els.fontSize.value;
          var panelW = +els.panelWidth.value;
          var bottomSpace = +els.bottomSpace.value;
          var cropPct = +els.cropRight.value;
          var showCursor = els.cursor.checked;
          var prompt = els.promptInput.value;
          var output = els.outputFull.value;

          els.fsVal.textContent = fontSize + "px";
          els.pwVal.textContent = panelW + "px";
          els.bsVal.textContent = bottomSpace + "px";
          els.crVal.textContent = cropPct + "%";
          els.cropInfo.textContent = cropPct + "%";

          var lineH = Math.round(fontSize * 1.33);
          var bodyFont = fontSize + "px " + MONO;

          meas.font = bodyFont;
          var charW = meas.measureText("M").width || (fontSize * 0.6);
          var textLeft = PAD_L + GUTTER;
          var maxChars = Math.max(10, Math.floor((panelW - textLeft - PAD_R) / charW));

          var raw = prompt.length ? (prompt + "\n" + output) : output;
          var lines = wrapChars(raw, maxChars);

          var cursorLine = lines.length - 1;
          var cursorCol = (lines[cursorLine] || "").length;
          if (cursorCol >= maxChars) { cursorLine++; cursorCol = 0; }

          var bodyLines = Math.max(lines.length, showCursor ? cursorLine + 1 : 0);
          var H = HEADER_H + PAD_T + bodyLines * lineH + PAD_B + bottomSpace;
          if (H < 160) H = 160;

          var S = 2;
          if (panelW * S * H * S > 2.0e8) S = 1;

          canvas.width = Math.round(panelW * S);
          canvas.height = Math.round(H * S);

          ctx.setTransform(S, 0, 0, S, 0, 0);
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.textRendering = "geometricPrecision";

          ctx.fillStyle = C_PANEL;
          ctx.fillRect(0, 0, panelW, H);
          ctx.fillStyle = C_BORDER;
          ctx.fillRect(0, 0, panelW, 1);

          drawHeader(panelW);

          var startY = HEADER_H + PAD_T;

          if (prompt.length > 0 && lines.length > 0) {
            var dotCx = PAD_L + GUTTER / 2 - 2;
            var dotCy = startY + lineH / 2 - 1;
            ctx.beginPath();
            ctx.arc(dotCx, dotCy, 4.5, 0, Math.PI * 2);
            ctx.strokeStyle = C_DOT;
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }

          ctx.font = bodyFont;
          ctx.textBaseline = "middle";
          ctx.fillStyle = C_TEXT;

          for (var i = 0; i < lines.length; i++) {
            if (lines[i]) {
              ctx.fillText(lines[i], textLeft, startY + i * lineH + lineH / 2);
            }
          }

          if (showCursor) {
            var cy = startY + cursorLine * lineH;
            var ch = Math.round(fontSize * 1.15);
            ctx.fillStyle = C_TEXT;
            ctx.fillRect(textLeft + cursorCol * charW, cy + (lineH - ch) / 2, charW, ch);
          }

          /* Info pills */
          var visibleW = Math.round(panelW * (1 - cropPct / 100));
          els.dimInfo.textContent = visibleW + " × " + H + " px";
          els.lineInfo.textContent = lines.length;

          updateCanvasDisplay(panelW, cropPct);
          refreshResetButtons();

          requestAnimationFrame(function () { updateCropOverlay(cropPct); });

          /* Preset highlight */
          var presetBtns = els.presets.querySelectorAll(".preset");
          for (var k = 0; k < presetBtns.length; k++) {
            var pw = +presetBtns[k].dataset.w;
            presetBtns[k].classList.toggle("active", pw === panelW);
          }
        } catch (err) {
          console.error("Render error:", err);
        }
      }

      /* ============================================================
         EXPORT
         ============================================================ */
      function buildExportCanvas() {
        var cropPct = +els.cropRight.value;
        var visibleFrac = 1 - cropPct / 100;
        var srcW = canvas.width;
        var srcH = canvas.height;
        var outW = Math.max(1, Math.round(srcW * visibleFrac));

        var tmp = document.createElement("canvas");
        tmp.width = outW;
        tmp.height = srcH;

        var tctx = tmp.getContext("2d");
        tctx.fillStyle = "#181818";
        tctx.fillRect(0, 0, outW, srcH);
        tctx.drawImage(canvas, 0, 0, outW, srcH, 0, 0, outW, srcH);
        return tmp;
      }

      function download() {
        try {
          var tmp = buildExportCanvas();
          var dataUrl = tmp.toDataURL("image/jpeg", JPG_QUALITY);
          var a = document.createElement("a");
          a.href = dataUrl;
          a.download = "snapterm.jpg";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          showToast("Saved · snapterm.jpg", "success");
        } catch (err) {
          console.error(err);
          showToast("Download failed", "error");
        }
      }

      function copyImage() {
        if (!navigator.clipboard || !window.ClipboardItem) {
          showToast("Clipboard unsupported", "error");
          return;
        }
        var tmp = buildExportCanvas();
        tmp.toBlob(function (blob) {
          navigator.clipboard.write([new ClipboardItem({ "image/png": blob })])
            .then(function () { showToast("Copied", "success"); })
            .catch(function () { showToast("Copy failed", "error"); });
        }, "image/png");
      }

      function reset() {
        els.promptInput.value = DEFAULT_PROMPT;
        els.outputFull.value = DEFAULT_OUTPUT;
        els.fontSize.value = 14;
        els.panelWidth.value = 1500;
        els.bottomSpace.value = 0;
        els.cropRight.value = 0;
        els.cursor.checked = true;
        render();
        showToast("Settings reset");
      }

      /* ============================================================
         BIND
         ============================================================ */
      function bind() {
        /* Nav — tabs + actions */
        els.tabs.addEventListener("click", function (ev) {
          var btn = ev.target.closest(".nav-item");
          if (!btn) return;

          if (btn.classList.contains("tab")) {
            switchTab(btn.dataset.tab);
            return;
          }
          var action = btn.dataset.action;
          if (action === "export") download();
          else if (action === "copy") copyImage();
          else if (action === "reset") reset();
        });

        els.outputFull.addEventListener("input", render);
        els.promptInput.addEventListener("input", render);

        var inputs = [els.fontSize, els.panelWidth, els.bottomSpace, els.cropRight, els.cursor];
        for (var i = 0; i < inputs.length; i++) {
          inputs[i].addEventListener("input", render);
          inputs[i].addEventListener("change", render);
        }

        els.presets.addEventListener("click", function (ev) {
          var target = ev.target.closest(".preset");
          if (!target) return;
          els.panelWidth.value = target.dataset.w;
          render();
        });

        document.addEventListener("click", function (ev) {
          var btn = ev.target.closest(".rst");
          if (!btn || btn.disabled) return;
          els[btn.dataset.target].value = btn.dataset.default;
          render();
        });

        els.dl.addEventListener("click", download);
        els.copyBtn.addEventListener("click", copyImage);
        els.resetBtn.addEventListener("click", reset);

        document.addEventListener("keydown", function (ev) {
          if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") {
            ev.preventDefault();
            download();
          }
        });
      }

      /* ============================================================
         INIT
         ============================================================ */
      function init() {
        els.promptInput.value = DEFAULT_PROMPT;
        els.outputFull.value = DEFAULT_OUTPUT;
        bind();
        applyLayout();
        render();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
</body>

</html>
