<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <title>SnapTerm — VS Code terminal screenshots</title>
  <meta name="description" content="Generate pixel-accurate VS Code terminal screenshots from pasted text. Runs entirely in your browser." />
  <style>
    :root {
      --bg: #0a0a0b;
      --card: #141416;
      --card-2: #1a1a1d;
      --border: #26262a;
      --border-2: #333338;
      --text: #e6e6e6;
      --text-2: #b8b8bd;
      --muted: #8b8b93;
      --accent: #3794ff;
      --success: #2f7a44;
      --shadow: 0 12px 34px rgba(0, 0, 0, .55);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(55, 148, 255, .09), transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      margin: 0;
      padding: 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 1;
    }

    /* ===================== Brand ===================== */
    .brand {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(135deg, #0e639c 0%, #3794ff 100%);
      color: #fff;
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -1px;
      box-shadow: 0 6px 16px rgba(55, 148, 255, .3);
      flex-shrink: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -.01em;
    }

    .brand p {
      margin: 1px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    /* ===================== Layout ===================== */
    .layout {
      flex: 1;
      min-height: 0;
    }

    /* ===================== Tabs ===================== */
    .tabs {
      display: flex;
      gap: 4px;
      padding: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all .12s;
      white-space: nowrap;
    }

    .tab:hover { color: #fff; background: var(--card-2); }

    .tab.active {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 4px 14px rgba(55, 148, 255, .25);
    }

    .tab svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* ===================== Panels ===================== */
    .panel {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(55, 148, 255, .07), transparent 55%),
        var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      min-height: 0;
      overflow: hidden;
    }

    .panel.active { display: flex; }

    .canvas-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 4px;
      margin: -4px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    #termCanvas {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .info-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 12px;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .info-bar b {
      color: var(--text-2);
      font-family: Consolas, monospace;
      font-size: 11.5px;
      font-weight: 600;
    }

    .info-bar .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--border-2);
    }

    /* Editor panels */
    .editor-panel textarea {
      flex: 1;
      min-height: 0;
      resize: none;
    }

    .editor-panel input[type=text] {
      min-height: 44px;
    }

    label.lbl {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      flex-shrink: 0;
    }

    input[type=text],
    textarea {
      width: 100%;
      background: #0b0b0d;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 12px;
      font-family: "Cascadia Mono", "Cascadia Code", Consolas, "Courier New", monospace;
      font-size: 12.5px;
      line-height: 1.5;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    input[type=text]:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(55, 148, 255, .15);
    }

    /* ===================== Side tools ===================== */
    .side-tools {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    .settings {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .settings-toggle {
      display: none;
      width: 100%;
      padding: 13px 16px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      background: transparent;
      border: none;
      cursor: pointer;
      align-items: center;
      justify-content: space-between;
      text-align: left;
    }

    .settings-toggle .chevron {
      width: 14px;
      height: 14px;
      fill: currentColor;
      transition: transform .2s;
    }

    .settings.open .settings-toggle .chevron {
      transform: rotate(180deg);
    }

    .settings-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .setting {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
    }

    .val {
      font-family: Consolas, monospace;
      font-size: 11px;
      color: var(--accent);
      background: rgba(55, 148, 255, .1);
      padding: 2px 7px;
      border-radius: 4px;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: var(--border-2);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      margin: 4px 0;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--card);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .4);
    }

    input[type=range]::-moz-range-thumb {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--card);
      cursor: pointer;
    }

    .presets {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .preset {
      font: inherit;
      font-size: 11.5px;
      padding: 5px 10px;
      background: transparent;
      border: 1px solid var(--border-2);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      transition: all .12s;
    }

    .preset:hover { color: #fff; border-color: var(--accent); }
    .preset.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .check {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-2);
      cursor: pointer;
      user-select: none;
    }

    input[type=checkbox] {
      -webkit-appearance: none;
      appearance: none;
      width: 17px;
      height: 17px;
      border: 1.5px solid var(--border-2);
      border-radius: 4px;
      background: #0b0b0d;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }

    input[type=checkbox]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    input[type=checkbox]:checked::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 1px;
      width: 4px;
      height: 9px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    /* ===================== Actions ===================== */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid transparent;
      padding: 11px 16px;
      cursor: pointer;
      transition: all .12s;
      white-space: nowrap;
    }

    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(55, 148, 255, .35);
    }

    button.primary {
      background: var(--accent);
      color: #fff;
      flex: 1 0 100%;
      box-shadow: 0 4px 14px rgba(55, 148, 255, .25);
    }

    button.primary:hover { background: #4da3ff; }
    button.primary:active { transform: translateY(1px); }

    button.ghost {
      background: var(--card);
      border-color: var(--border-2);
      color: var(--text-2);
      flex: 1;
    }

    button.ghost:hover { color: #fff; border-color: var(--accent); }
    button.ghost:active { transform: translateY(1px); }

    button svg { width: 15px; height: 15px; fill: currentColor; }

    /* ===================== Toast ===================== */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(16px);
      background: #1f1f22;
      border: 1px solid var(--border-2);
      color: #fff;
      padding: 11px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s, transform .22s;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .6);
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.success { border-color: var(--success); }
    .toast.error { border-color: #a33333; }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border-2);
      border-radius: 6px;
      border: 2px solid var(--card);
    }
    ::-webkit-scrollbar-thumb:hover { background: #4a4a52; }

    /* =====================
       DESKTOP (≥901px):
       2-column grid. Left = tabs + editor + tools. Right = preview (always on).
       ===================== */
    @media (min-width: 901px) {
      .layout {
        display: grid;
        grid-template-columns: 380px minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr) auto;
        grid-template-areas:
          "tabs     preview"
          "editor   preview"
          "tools    preview";
        gap: 12px 20px;
      }

      .tabs { grid-area: tabs; }
      .side-tools { grid-area: tools; }

      .panel[data-panel="terminal"],
      .panel[data-panel="prompt"] {
        grid-area: editor;
      }

      .panel[data-panel="preview"] {
        grid-area: preview;
      }

      /* Preview tab and preview panel are handled by JS on desktop */
      .tab[data-tab="preview"] { display: none; }
    }

    /* =====================
       MOBILE (≤900px):
       Single column. All 3 tabs visible. Settings collapsible.
       ===================== */
    @media (max-width: 900px) {
      .app { padding: 12px; gap: 12px; }

      .brand-mark { width: 34px; height: 34px; font-size: 13px; }
      .brand h1 { font-size: 16px; }
      .brand p { display: none; }

      .layout {
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
        min-height: 0;
      }

      .tabs {
        order: 1;
        flex-direction: row;
        padding: 5px;
        gap: 3px;
        flex-shrink: 0;
      }

      .tab {
        padding: 10px 6px;
        font-size: 12.5px;
      }

      .tab svg { display: none; }

      .panel {
        order: 2;
        flex: 1;
        min-height: 0;
        padding: 12px;
        border-radius: 12px;
      }

      .side-tools {
        order: 3;
        flex-shrink: 0;
        gap: 10px;
      }

      .settings-toggle { display: flex; }
      .settings-body {
        display: none;
        border-top: 1px solid var(--border);
        padding: 14px 16px;
      }
      .settings.open .settings-body { display: flex; }

      button.ghost { padding: 10px 14px; }
      .info-bar { padding: 8px 12px; font-size: 11.5px; }
    }

    @media (max-width: 420px) {
      .tab { padding: 9px 4px; font-size: 12px; }
      .actions button { font-size: 12.5px; }
    }
  </style>
</head>
<body>
  <div class="app">

    <header class="brand">
      <div class="brand-mark">&gt;_</div>
      <div>
        <h1>SnapTerm</h1>
        <p>VS Code terminal screenshots — in your browser</p>
      </div>
    </header>

    <div class="layout">

      <!-- Tabs -->
      <nav class="tabs" id="tabs">
        <button class="tab" data-tab="preview" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 3C4.5 3 1.5 5.5.2 8c1.3 2.5 4.3 5 7.8 5s6.5-2.5 7.8-5C14.5 5.5 11.5 3 8 3Zm0 8.5A3.5 3.5 0 1 1 8 4.5a3.5 3.5 0 0 1 0 7Zm0-5.5A2 2 0 1 0 8 10 2 2 0 0 0 8 6Z"/>
          </svg>
          Preview
        </button>
        <button class="tab" data-tab="terminal" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2 2.5A1.5 1.5 0 0 0 .5 4v8A1.5 1.5 0 0 0 2 13.5h12A1.5 1.5 0 0 0 15.5 12V4A1.5 1.5 0 0 0 14 2.5H2ZM3.5 5.7l2.3 2.3-2.3 2.3.7.7L7.2 8 4.2 5l-.7.7ZM8 10h5v1H8v-1Z"/>
          </svg>
          Terminal
        </button>
        <button class="tab" data-tab="prompt" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3.6 3.3 7.4 7.1v1.8L3.6 12.7l-1-1L5.9 8 2.6 4.3l1-1Zm7.4 8.4h-3v1.4h3v-1.4Z"/>
          </svg>
          Prompt
        </button>
      </nav>

      <!-- Terminal editor -->
      <section class="panel editor-panel" data-panel="terminal">
        <label class="lbl" for="outputFull">Terminal output</label>
        <textarea id="outputFull" spellcheck="false" placeholder="Paste your program output…"></textarea>
      </section>

      <!-- Prompt editor -->
      <section class="panel editor-panel" data-panel="prompt">
        <label class="lbl" for="promptInput">Prompt / command line</label>
        <input type="text" id="promptInput" spellcheck="false" />
      </section>

      <!-- Preview panel -->
      <section class="panel" data-panel="preview">
        <div class="canvas-scroll">
          <canvas id="termCanvas"></canvas>
        </div>
        <div class="info-bar">
          <span>Size: <b id="dimInfo">—</b></span>
          <span class="dot"></span>
          <span>Lines: <b id="lineInfo">—</b></span>
          <span class="dot"></span>
          <span>JPEG · 95%</span>
        </div>
      </section>

      <!-- Side tools -->
      <aside class="side-tools">

        <section class="settings" id="settings">
          <button class="settings-toggle" id="settingsToggle" type="button">
            <span>Settings</span>
            <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 11 3 6l1-1 4 4 4-4 1 1-5 5Z"/>
            </svg>
          </button>

          <div class="settings-body">

            <div class="setting">
              <label class="setting-label" for="fontSize">
                Font size <span class="val" id="fsVal">14px</span>
              </label>
              <input type="range" id="fontSize" min="10" max="22" step="1" value="14" />
            </div>

            <div class="setting">
              <label class="setting-label" for="panelWidth">
                Panel width <span class="val" id="pwVal">1500px</span>
              </label>
              <input type="range" id="panelWidth" min="700" max="2600" step="10" value="1500" />
              <div class="presets" id="presets">
                <button class="preset" data-w="1000" type="button">1080p</button>
                <button class="preset" data-w="1500" type="button">1500</button>
                <button class="preset" data-w="1920" type="button">1920</button>
                <button class="preset" data-w="2400" type="button">Wide</button>
              </div>
            </div>

            <div class="setting">
              <label class="setting-label" for="bottomSpace">
                Bottom space <span class="val" id="bsVal">0px</span>
              </label>
              <input type="range" id="bottomSpace" min="0" max="800" step="10" value="0" />
            </div>

            <div class="setting">
              <label class="check">
                <input type="checkbox" id="cursor" checked />
                <span>Show cursor</span>
              </label>
            </div>

          </div>
        </section>

        <div class="actions">
          <button class="primary" id="dl" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 12.5 3.5 8l1.06-1.06L7.25 9.63V1.5h1.5v8.13l2.69-2.69L12.5 8 8 12.5Zm-5 1.5h10v1H3v-1Z"/>
            </svg>
            Download JPG
          </button>
          <button class="ghost" id="copyBtn" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M10 1H3a1 1 0 0 0-1 1v8h1.5V2.5H10V1Zm2 2.5H6a1 1 0 0 0-1 1V14a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.5a1 1 0 0 0-1-1Zm0 10.5H6V4.5h6V14Z"/>
            </svg>
            Copy
          </button>
          <button class="ghost" id="resetBtn" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 3a5 5 0 1 0 4.546 2.914.75.75 0 0 1 1.302-.746A6.5 6.5 0 1 1 8 1.5V.75a.25.25 0 0 1 .41-.19l2.5 2.5a.25.25 0 0 1 0 .38l-2.5 2.5A.25.25 0 0 1 8 5.75V3Z"/>
            </svg>
            Reset
          </button>
        </div>

      </aside>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      "use strict";

      var DEFAULT_PROMPT = 'PS D:\\TEJ\\Study\\.INFORMATION TECHNOLOGY\\sem 3\\CODE\\FDS tejas\\exp 4> cd "d:\\TEJ\\Study\\.INFORMATION TECHNOLOGY\\sem 3\\CODE\\FDS tejas\\exp 4" ; if ($?) { g++ exp4_a.cpp -o exp4_a } ; if ($?) { .\\exp4_a }';

      var DEFAULT_OUTPUT = [
        "===== MENU =====",
        "[1] Insert at Start",
        "[2] Insert at End",
        "[3] Insert at Position",
        "[4] Delete at Start",
        "[5] Delete at End",
        "[6] Delete at Position",
        "[7] Display",
        "[8] Exit",
        "Enter your choice: "
      ].join("\n");

      var JPG_QUALITY = 0.95;
      var HEADER_H = 35;
      var GUTTER = 22;
      var PAD_L = 6;
      var PAD_R = 12;
      var PAD_T = 4;
      var PAD_B = 8;

      var MONO = '"Cascadia Mono", "Cascadia Code", Consolas, "Courier New", monospace';
      var UI_FONT = '13px "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif';

      var C_PANEL = "#181818";
      var C_BORDER = "#2b2b2b";
      var C_TAB = "#9d9d9d";
      var C_TAB_ON = "#e7e7e7";
      var C_TAB_BG = "#2b2b2b";
      var C_TEXT = "#cccccc";
      var C_ICON = "#c8c8c8";
      var C_DOT = "#8a8a8a";

      function $(id) { return document.getElementById(id); }
      function isMobile() { return window.matchMedia("(max-width: 900px)").matches; }

      var els = {
        tabs: $("tabs"),
        panels: document.querySelectorAll(".panel"),
        tabButtons: document.querySelectorAll(".tab"),

        outputFull: $("outputFull"),
        promptInput: $("promptInput"),

        fontSize: $("fontSize"),
        panelWidth: $("panelWidth"),
        bottomSpace: $("bottomSpace"),
        cursor: $("cursor"),

        fsVal: $("fsVal"),
        pwVal: $("pwVal"),
        bsVal: $("bsVal"),
        dimInfo: $("dimInfo"),
        lineInfo: $("lineInfo"),

        presets: $("presets"),
        dl: $("dl"),
        copyBtn: $("copyBtn"),
        resetBtn: $("resetBtn"),

        settings: $("settings"),
        settingsToggle: $("settingsToggle"),

        toast: $("toast")
      };

      var canvas = $("termCanvas");
      var ctx = canvas.getContext("2d");
      var meas = document.createElement("canvas").getContext("2d");

      /* ---------- Active tab state ----------------------------------- */
      var currentTab = isMobile() ? "preview" : "terminal";

      function applyLayout() {
        var mobile = isMobile();

        // Tabs
        for (var i = 0; i < els.tabButtons.length; i++) {
          var t = els.tabButtons[i];
          t.classList.toggle("active", t.dataset.tab === currentTab);
        }

        // Panels
        for (var j = 0; j < els.panels.length; j++) {
          var p = els.panels[j];
          var name = p.dataset.panel;

          if (!mobile && name === "preview") {
            // Desktop: preview always visible
            p.classList.add("active");
          } else {
            p.classList.toggle("active", name === currentTab);
          }
        }
      }

      function switchTab(name) {
        if (!isMobile() && name === "preview") return;
        currentTab = name;
        applyLayout();
      }

      window.addEventListener("resize", function () {
        if (!isMobile() && currentTab === "preview") {
          currentTab = "terminal";
        }
        applyLayout();
      });

      /* ---------- Toast ---------------------------------------------- */
      var toastTimer = null;
      function showToast(msg, kind) {
        els.toast.textContent = msg;
        els.toast.className = "toast show" + (kind ? " " + kind : "");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          els.toast.className = "toast" + (kind ? " " + kind : "");
        }, 1800);
      }

      /* ---------- Text helpers --------------------------------------- */
      function wrapChars(text, maxChars) {
        var out = [];
        var paras = String(text)
          .replace(/\r\n?/g, "\n")
          .replace(/\t/g, "    ")
          .split("\n");

        for (var p = 0; p < paras.length; p++) {
          var para = paras[p];
          if (para.length === 0) { out.push(""); continue; }
          for (var i = 0; i < para.length; i += maxChars) {
            out.push(para.slice(i, i + maxChars));
          }
        }
        return out.length ? out : [""];
      }

      /* ---------- Drawing helpers ------------------------------------ */
      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function drawPlus(cx, cy) {
        var r = 5.5;
        ctx.beginPath();
        ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
        ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
        ctx.stroke();
      }

      function drawChevron(cx, cy, dir) {
        var w = 4.5, h = 2.5;
        var d = dir === "down" ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(cx - w, cy - h * d);
        ctx.lineTo(cx, cy + h * d);
        ctx.lineTo(cx + w, cy - h * d);
        ctx.stroke();
      }

      function drawClose(cx, cy) {
        var r = 4.5;
        ctx.beginPath();
        ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r);
        ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r);
        ctx.stroke();
      }

      function drawHeader(W) {
        ctx.font = UI_FONT;
        ctx.textBaseline = "middle";

        var tabs = [
          ["Problems", false],
          ["Debug Console", false],
          ["Terminal", true]
        ];

        var x = 0;
        for (var i = 0; i < tabs.length; i++) {
          var label = tabs[i][0];
          var active = tabs[i][1];
          var tw = ctx.measureText(label).width + 22;

          if (active) {
            ctx.fillStyle = C_TAB_BG;
            roundRect(x + 3, 5, tw - 6, HEADER_H - 10, 5);
            ctx.fill();
          }

          ctx.fillStyle = active ? C_TAB_ON : C_TAB;
          ctx.fillText(label, x + 11, HEADER_H / 2 + 1);
          x += tw;
        }

        var iy = Math.round(HEADER_H / 2);
        ctx.strokeStyle = C_ICON;
        ctx.lineWidth = 1.2;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        var cx = W - 16;
        drawClose(cx, iy);           cx -= 28;
        drawChevron(cx, iy, "up");   cx -= 28;
        drawChevron(cx, iy, "down"); cx -= 28;
        drawPlus(cx, iy);
      }

      /* ---------- Render --------------------------------------------- */
      function render() {
        try {
          var fontSize = +els.fontSize.value;
          var panelW = +els.panelWidth.value;
          var bottomSpace = +els.bottomSpace.value;
          var showCursor = els.cursor.checked;
          var prompt = els.promptInput.value;
          var output = els.outputFull.value;

          els.fsVal.textContent = fontSize + "px";
          els.pwVal.textContent = panelW + "px";
          els.bsVal.textContent = bottomSpace + "px";

          var lineH = Math.round(fontSize * 1.33);
          var bodyFont = fontSize + "px " + MONO;

          meas.font = bodyFont;
          var charW = meas.measureText("M").width || (fontSize * 0.6);
          var textLeft = PAD_L + GUTTER;
          var maxChars = Math.max(10, Math.floor((panelW - textLeft - PAD_R) / charW));

          var raw = prompt.length ? (prompt + "\n" + output) : output;
          var lines = wrapChars(raw, maxChars);

          var cursorLine = lines.length - 1;
          var cursorCol = (lines[cursorLine] || "").length;
          if (cursorCol >= maxChars) { cursorLine++; cursorCol = 0; }

          var bodyLines = Math.max(lines.length, showCursor ? cursorLine + 1 : 0);
          var H = HEADER_H + PAD_T + bodyLines * lineH + PAD_B + bottomSpace;
          if (H < 160) H = 160;

          var S = 2;
          if (panelW * S * H * S > 2.0e8) S = 1;

          canvas.width = Math.round(panelW * S);
          canvas.height = Math.round(H * S);
          canvas.style.width = panelW + "px";
          canvas.style.height = "auto";

          ctx.setTransform(S, 0, 0, S, 0, 0);
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.textRendering = "geometricPrecision";

          ctx.fillStyle = C_PANEL;
          ctx.fillRect(0, 0, panelW, H);
          ctx.fillStyle = C_BORDER;
          ctx.fillRect(0, 0, panelW, 1);

          drawHeader(panelW);

          var startY = HEADER_H + PAD_T;

          if (prompt.length > 0 && lines.length > 0) {
            var dotCx = PAD_L + GUTTER / 2 - 2;
            var dotCy = startY + lineH / 2 - 1;
            ctx.beginPath();
            ctx.arc(dotCx, dotCy, 4.5, 0, Math.PI * 2);
            ctx.strokeStyle = C_DOT;
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }

          ctx.font = bodyFont;
          ctx.textBaseline = "middle";
          ctx.fillStyle = C_TEXT;

          for (var i = 0; i < lines.length; i++) {
            if (lines[i]) {
              ctx.fillText(lines[i], textLeft, startY + i * lineH + lineH / 2);
            }
          }

          if (showCursor) {
            var cy = startY + cursorLine * lineH;
            var ch = Math.round(fontSize * 1.15);
            ctx.fillStyle = C_TEXT;
            ctx.fillRect(textLeft + cursorCol * charW, cy + (lineH - ch) / 2, charW, ch);
          }

          els.dimInfo.textContent = panelW + " × " + H + " px";
          els.lineInfo.textContent = lines.length;

          var presetBtns = els.presets.querySelectorAll(".preset");
          for (var k = 0; k < presetBtns.length; k++) {
            var pw = +presetBtns[k].dataset.w;
            if (pw === panelW) presetBtns[k].classList.add("active");
            else presetBtns[k].classList.remove("active");
          }
        } catch (err) {
          console.error("Render error:", err);
        }
      }

      /* ---------- Download / Copy ------------------------------------ */
      function download() {
        try {
          var tmp = document.createElement("canvas");
          tmp.width = canvas.width;
          tmp.height = canvas.height;
          var tctx = tmp.getContext("2d");
          tctx.fillStyle = "#181818";
          tctx.fillRect(0, 0, tmp.width, tmp.height);
          tctx.drawImage(canvas, 0, 0);

          var dataUrl = tmp.toDataURL("image/jpeg", JPG_QUALITY);
          var a = document.createElement("a");
          a.href = dataUrl;
          a.download = "snapterm.jpg";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          showToast("Saved as snapterm.jpg", "success");
        } catch (err) {
          console.error(err);
          showToast("Download failed", "error");
        }
      }

      function copyImage() {
        if (!navigator.clipboard || !window.ClipboardItem) {
          showToast("Clipboard not supported", "error");
          return;
        }
        canvas.toBlob(function (blob) {
          navigator.clipboard.write([new ClipboardItem({ "image/png": blob })])
            .then(function () { showToast("Copied", "success"); })
            .catch(function () { showToast("Copy failed", "error"); });
        }, "image/png");
      }

      function reset() {
        els.promptInput.value = DEFAULT_PROMPT;
        els.outputFull.value = DEFAULT_OUTPUT;
        els.fontSize.value = 14;
        els.panelWidth.value = 1500;
        els.bottomSpace.value = 0;
        els.cursor.checked = true;
        render();
        showToast("Settings reset");
      }

      function toggleSettings() {
        els.settings.classList.toggle("open");
      }

      /* ---------- Bind ----------------------------------------------- */
      function bind() {
        els.tabs.addEventListener("click", function (ev) {
          var btn = ev.target.closest(".tab");
          if (btn) switchTab(btn.dataset.tab);
        });

        els.outputFull.addEventListener("input", render);
        els.promptInput.addEventListener("input", render);

        var inputs = [els.fontSize, els.panelWidth, els.bottomSpace, els.cursor];
        for (var i = 0; i < inputs.length; i++) {
          inputs[i].addEventListener("input", render);
          inputs[i].addEventListener("change", render);
        }

        els.presets.addEventListener("click", function (ev) {
          var target = ev.target.closest(".preset");
          if (!target) return;
          els.panelWidth.value = target.dataset.w;
          render();
        });

        els.dl.addEventListener("click", download);
        els.copyBtn.addEventListener("click", copyImage);
        els.resetBtn.addEventListener("click", reset);

        els.settingsToggle.addEventListener("click", toggleSettings);

        document.addEventListener("keydown", function (ev) {
          if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") {
            ev.preventDefault();
            download();
          }
        });
      }

      /* ---------- Init ----------------------------------------------- */
      function init() {
        els.promptInput.value = DEFAULT_PROMPT;
        els.outputFull.value = DEFAULT_OUTPUT;
        bind();
        applyLayout();
        render();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
