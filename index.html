<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <title>SnapTerm — VS Code terminal screenshots</title>
  <meta name="description" content="Generate pixel-accurate VS Code terminal screenshots from pasted text." />
  <style>
    :root {
      --bg: #0a0a0b;
      --card: #141416;
      --card-2: #1a1a1d;
      --border: #26262a;
      --border-2: #333338;
      --text: #e6e6e6;
      --text-2: #b8b8bd;
      --muted: #8b8b93;
      --accent: #3794ff;
      --success: #2f7a44;
      --shadow: 0 12px 34px rgba(0, 0, 0, .55);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(55, 148, 255, .09), transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 1;
    }

    .brand {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(135deg, #0e639c 0%, #3794ff 100%);
      color: #fff;
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -1px;
      box-shadow: 0 6px 16px rgba(55, 148, 255, .3);
      flex-shrink: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -.01em;
    }

    .brand p {
      margin: 1px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .layout { flex: 1; min-height: 0; }

    /* ===== Tabs ===== */
    .tabs {
      display: flex;
      gap: 4px;
      padding: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all .12s;
      white-space: nowrap;
    }

    .tab:hover { color: #fff; background: var(--card-2); }

    .tab.active {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 4px 14px rgba(55, 148, 255, .25);
    }

    .tab svg { width: 15px; height: 15px; fill: currentColor; flex-shrink: 0; }

    /* ===== Panels ===== */
    .panel {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(55, 148, 255, .07), transparent 55%),
        var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      min-height: 0;
      overflow: hidden;
    }

    .panel.active { display: flex; }

    .canvas-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 4px;
      margin: -4px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .canvas-wrap {
      position: relative;
      display: inline-block;
      max-width: 100%;
      line-height: 0;
    }

    #termCanvas {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    /* Mobile + crop: zoom the visible region, but keep a peek of the cropped side */
    .canvas-wrap.cropping {
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }
    .canvas-wrap.cropping #termCanvas {
      max-width: none;
      border-radius: 8px 0 0 8px;
    }
    /* Keep the crop marker visible on mobile — softer so the peek stays readable */
    .canvas-wrap.cropping .crop-overlay {
      background: rgba(0, 0, 0, .45);
      backdrop-filter: none;
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
    }

    .crop-overlay {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      background: rgba(0, 0, 0, .55);
      backdrop-filter: blur(1px);
      pointer-events: none;
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
      display: none;
    }

    .crop-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 0;
      border-left: 1.5px dashed var(--accent);
      pointer-events: none;
      display: none;
    }

    .info-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 12px;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .info-bar b {
      color: var(--text-2);
      font-family: Consolas, monospace;
      font-size: 11.5px;
      font-weight: 600;
    }

    .info-bar .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--border-2);
    }

    .editor-panel textarea { flex: 1; min-height: 0; resize: none; }
    .editor-panel input[type=text] { min-height: 44px; }

    label.lbl {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      flex-shrink: 0;
    }

    input[type=text],
    textarea {
      width: 100%;
      background: #0b0b0d;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 12px;
      font-family: "Cascadia Mono", "Cascadia Code", Consolas, "Courier New", monospace;
      font-size: 12.5px;
      line-height: 1.5;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    input[type=text]:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(55, 148, 255, .15);
    }

    /* ===== Side tools ===== */
    .side-tools {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    .settings {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .settings-toggle {
      display: none;
      width: 100%;
      padding: 13px 16px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      background: transparent;
      border: none;
      cursor: pointer;
      align-items: center;
      justify-content: space-between;
      text-align: left;
    }

    .settings-toggle .chevron {
      width: 14px;
      height: 14px;
      fill: currentColor;
      transition: transform .2s;
    }

    .settings.open .settings-toggle .chevron { transform: rotate(180deg); }

    .settings-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .setting { display: flex; flex-direction: column; gap: 6px; }

    .setting-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      gap: 8px;
    }

    .setting-label > span:first-child { flex: 1; }

    .setting-label-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .slider-reset {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      padding: 0;
      background: transparent;
      border: 1px solid var(--border-2);
      border-radius: 5px;
      color: var(--muted);
      cursor: pointer;
      transition: all .12s;
      flex-shrink: 0;
    }

    .slider-reset svg { width: 11px; height: 11px; fill: currentColor; }

    .slider-reset:hover:not(:disabled) {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(55, 148, 255, .08);
    }

    .slider-reset:active:not(:disabled) { transform: scale(.92); }

    .slider-reset:disabled {
      opacity: .35;
      cursor: not-allowed;
      pointer-events: none;
    }

    .val {
      font-family: Consolas, monospace;
      font-size: 11px;
      color: var(--accent);
      background: rgba(55, 148, 255, .1);
      padding: 2px 7px;
      border-radius: 4px;
      min-width: 46px;
      text-align: center;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: var(--border-2);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      margin: 4px 0;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--card);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .4);
    }

    input[type=range]::-moz-range-thumb {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--card);
      cursor: pointer;
    }

    .presets {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .preset {
      font: inherit;
      font-size: 11.5px;
      padding: 5px 10px;
      background: transparent;
      border: 1px solid var(--border-2);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      transition: all .12s;
    }

    .preset:hover { color: #fff; border-color: var(--accent); }
    .preset.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .check {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-2);
      cursor: pointer;
      user-select: none;
    }

    input[type=checkbox] {
      -webkit-appearance: none;
      appearance: none;
      width: 17px;
      height: 17px;
      border: 1.5px solid var(--border-2);
      border-radius: 4px;
      background: #0b0b0d;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }

    input[type=checkbox]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    input[type=checkbox]:checked::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 1px;
      width: 4px;
      height: 9px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    /* ===== Actions ===== */
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid transparent;
      padding: 11px 16px;
      cursor: pointer;
      transition: all .12s;
      white-space: nowrap;
    }

    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(55, 148, 255, .35);
    }

    button.primary {
      background: var(--accent);
      color: #fff;
      flex: 1 0 100%;
      box-shadow: 0 4px 14px rgba(55, 148, 255, .25);
    }

    button.primary:hover { background: #4da3ff; }
    button.primary:active { transform: translateY(1px); }

    button.ghost {
      background: var(--card);
      border-color: var(--border-2);
      color: var(--text-2);
      flex: 1;
    }

    button.ghost:hover { color: #fff; border-color: var(--accent); }
    button.ghost:active { transform: translateY(1px); }

    button svg { width: 15px; height: 15px; fill: currentColor; }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(16px);
      background: #1f1f22;
      border: 1px solid var(--border-2);
      color: #fff;
      padding: 11px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s, transform .22s;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .6);
      z-index: 200;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: #a33333; }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border-2);
      border-radius: 6px;
      border: 2px solid var(--card);
    }
    ::-webkit-scrollbar-thumb:hover { background: #4a4a52; }

    /* ===== Desktop (≥901px) ===== */
    @media (min-width: 901px) {
      .layout {
        display: grid;
        grid-template-columns: 380px minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr) auto;
        grid-template-areas:
          "tabs     preview"
          "editor   preview"
          "tools    preview";
        gap: 12px 20px;
      }
      .tabs { grid-area: tabs; }
      .side-tools { grid-area: tools; }
      .panel[data-panel="terminal"],
      .panel[data-panel="prompt"] { grid-area: editor; }
      .panel[data-panel="preview"] { grid-area: preview; }
      .tab[data-tab="preview"] { display: none; }
    }

    /* ===== Mobile (≤900px) ===== */
    @media (max-width: 900px) {
      .app { padding: 12px; gap: 12px; }
      .brand-mark { width: 34px; height: 34px; font-size: 13px; }
      .brand h1 { font-size: 16px; }
      .brand p { display: none; }

      .layout {
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
        min-height: 0;
      }

      .tabs {
        order: 1;
        flex-direction: row;
        padding: 5px;
        gap: 3px;
        flex-shrink: 0;
      }

      .tab { padding: 10px 6px; font-size: 12.5px; }
      .tab svg { display: none; }

      .panel {
        order: 2;
        flex: 1;
        min-height: 0;
        padding: 12px;
        border-radius: 12px;
      }

      .side-tools { order: 3; flex-shrink: 0; gap: 10px; }

      .settings-toggle { display: flex; }
      .settings-body {
        display: none;
        border-top: 1px solid var(--border);
        padding: 14px 16px;
      }
      .settings.open .settings-body { display: flex; }

      button.ghost { padding: 10px 14px; }
      .info-bar { padding: 8px 12px; font-size: 11.5px; }
    }

    @media (max-width: 420px) {
      .tab { padding: 9px 4px; font-size: 12px; }
      .actions button { font-size: 12.5px; }
    }
  </style>
</head>
<body>
  <div class="app">

    <header class="brand">
      <div class="brand-mark">&gt;_</div>
      <div>
        <h1>SnapTerm</h1>
        <p>VS Code terminal screenshots — in your browser</p>
      </div>
    </header>

    <div class="layout">

      <nav class="tabs" id="tabs">
        <button class="tab" data-tab="preview" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 3C4.5 3 1.5 5.5.2 8c1.3 2.5 4.3 5 7.8 5s6.5-2.5 7.8-5C14.5 5.5 11.5 3 8 3Zm0 8.5A3.5 3.5 0 1 1 8 4.5a3.5 3.5 0 0 1 0 7Zm0-5.5A2 2 0 1 0 8 10 2 2 0 0 0 8 6Z"/>
          </svg>
          Preview
        </button>
        <button class="tab" data-tab="terminal" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2 2.5A1.5 1.5 0 0 0 .5 4v8A1.5 1.5 0 0 0 2 13.5h12A1.5 1.5 0 0 0 15.5 12V4A1.5 1.5 0 0 0 14 2.5H2ZM3.5 5.7l2.3 2.3-2.3 2.3.7.7L7.2 8 4.2 5l-.7.7ZM8 10h5v1H8v-1Z"/>
          </svg>
          Terminal
        </button>
        <button class="tab" data-tab="prompt" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3.6 3.3 7.4 7.1v1.8L3.6 12.7l-1-1L5.9 8 2.6 4.3l1-1Zm7.4 8.4h-3v1.4h3v-1.4Z"/>
          </svg>
          Prompt
        </button>
      </nav>

      <section class="panel editor-panel" data-panel="terminal">
        <label class="lbl" for="outputFull">Terminal output</label>
        <textarea id="outputFull" spellcheck="false" placeholder="Paste your program output…"></textarea>
      </section>

      <section class="panel editor-panel" data-panel="prompt">
        <label class="lbl" for="promptInput">Prompt / command line</label>
        <input type="text" id="promptInput" spellcheck="false" />
      </section>

      <section class="panel" data-panel="preview">
        <div class="canvas-scroll">
          <div class="canvas-wrap" id="canvasWrap">
            <canvas id="termCanvas"></canvas>
            <div class="crop-overlay" id="cropOverlay"></div>
            <div class="crop-line" id="cropLine"></div>
          </div>
        </div>
        <div class="info-bar">
          <span>Size: <b id="dimInfo">—</b></span>
          <span class="dot"></span>
          <span>Lines: <b id="lineInfo">—</b></span>
          <span class="dot"></span>
          <span>Crop: <b id="cropInfo">0%</b></span>
          <span class="dot"></span>
          <span>JPEG · 95%</span>
        </div>
      </section>

      <aside class="side-tools">

        <section class="settings" id="settings">
          <button class="settings-toggle" id="settingsToggle" type="button">
            <span>Settings</span>
            <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 11 3 6l1-1 4 4 4-4 1 1-5 5Z"/>
            </svg>
          </button>

          <div class="settings-body">

            <!-- Font size -->
            <div class="setting">
              <div class="setting-label">
                <span>Font size</span>
                <div class="setting-label-right">
                  <span class="val" id="fsVal">14px</span>
                  <button class="slider-reset" type="button" title="Reset font size" data-target="fontSize" data-default="14">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                      <path d="M8 3a5 5 0 1 0 4.546 2.914.75.75 0 0 1 1.302-.746A6.5 6.5 0 1 1 8 1.5V.75a.25.25 0 0 1 .41-.19l2.5 2.5a.25.25 0 0 1 0 .38l-2.5 2.5A.25.25 0 0 1 8 5.75V3Z"/>
                    </svg>
                  </button>
                </div>
              </div>
              <input type="range" id="fontSize" min="10" max="22" step="1" value="14" />
            </div>

            <!-- Panel width -->
            <div class="setting">
              <div class="setting-label">
                <span>Panel width</span>
                <div class="setting-label-right">
                  <span class="val" id="pwVal">1500px</span>
                  <button class="slider-reset" type="button" title="Reset panel width" data-target="panelWidth" data-default="1500">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                      <path d="M8 3a5 5 0 1 0 4.546 2.914.75.75 0 0 1 1.302-.746A6.5 6.5 0 1 1 8 1.5V.75a.25.25 0 0 1 .41-.19l2.5 2.5a.25.25 0 0 1 0 .38l-2.5 2.5A.25.25 0 0 1 8 5.75V3Z"/>
                    </svg>
                  </button>
                </div>
              </div>
              <input type="range" id="panelWidth" min="700" max="2600" step="10" value="1500" />
              <div class="presets" id="presets">
                <button class="preset" data-w="1000" type="button">1080p</button>
                <button class="preset" data-w="1500" type="button">1500</button>
                <button class="preset" data-w="1920" type="button">1920</button>
                <button class="preset" data-w="2400" type="button">Wide</button>
              </div>
            </div>

            <!-- Bottom space -->
            <div class="setting">
              <div class="setting-label">
                <span>Bottom space</span>
                <div class="setting-label-right">
                  <span class="val" id="bsVal">0px</span>
                  <button class="slider-reset" type="button" title="Reset bottom space" data-target="bottomSpace" data-default="0">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                      <path d="M8 3a5 5 0 1 0 4.546 2.914.75.75 0 0 1 1.302-.746A6.5 6.5 0 1 1 8 1.5V.75a.25.25 0 0 1 .41-.19l2.5 2.5a.25.25 0 0 1 0 .38l-2.5 2.5A.25.25 0 0 1 8 5.75V3Z"/>
                    </svg>
                  </button>
                </div>
              </div>
              <input type="range" id="bottomSpace" min="0" max="800" step="10" value="0" />
            </div>

            <!-- Crop from right -->
            <div class="setting">
              <div class="setting-label">
                <span>Crop from right</span>
                <div class="setting-label-right">
                  <span class="val" id="crVal">0%</span>
                  <button class="slider-reset" type="button" title="Reset crop" data-target="cropRight" data-default="0">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                      <path d="M8 3a5 5 0 1 0 4.546 2.914.75.75 0 0 1 1.302-.746A6.5 6.5 0 1 1 8 1.5V.75a.25.25 0 0 1 .41-.19l2.5 2.5a.25.25 0 0 1 0 .38l-2.5 2.5A.25.25 0 0 1 8 5.75V3Z"/>
                    </svg>
                  </button>
                </div>
              </div>
              <input type="range" id="cropRight" min="0" max="95" step="5" value="0" />
            </div>

            <div class="setting">
              <label class="check">
                <input type="checkbox" id="cursor" checked />
                <span>Show cursor</span>
              </label>
            </div>

          </div>
        </section>

        <div class="actions">
          <button class="primary" id="dl" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 12.5 3.5 8l1.06-1.06L7.25 9.63V1.5h1.5v8.13l2.69-2.69L12.5 8 8 12.5Zm-5 1.5h10v1H3v-1Z"/>
            </svg>
            Download JPG
          </button>
          <button class="ghost" id="copyBtn" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M10 1H3a1 1 0 0 0-1 1v8h1.5V2.5H10V1Zm2 2.5H6a1 1 0 0 0-1 1V14a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.5a1 1 0 0 0-1-1Zm0 10.5H6V4.5h6V14Z"/>
            </svg>
            Copy
          </button>
          <button class="ghost" id="resetBtn" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 3a5 5 0 1 0 4.546 2.914.75.75 0 0 1 1.302-.746A6.5 6.5 0 1 1 8 1.5V.75a.25.25 0 0 1 .41-.19l2.5 2.5a.25.25 0 0 1 0 .38l-2.5 2.5A.25.25 0 0 1 8 5.75V3Z"/>
            </svg>
            Reset
          </button>
        </div>

      </aside>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      "use strict";

      var DEFAULT_PROMPT = 'PS D:\\TEJ\\Study\\.INFORMATION TECHNOLOGY\\sem 3\\CODE\\FDS tejas\\exp 4> cd "d:\\TEJ\\Study\\.INFORMATION TECHNOLOGY\\sem 3\\CODE\\FDS tejas\\exp 4" ; if ($?) { g++ exp4_a.cpp -o exp4_a } ; if ($?) { .\\exp4_a }';

      var DEFAULT_OUTPUT = [
        "===== MENU =====",
        "[1] Insert at Start",
        "[2] Insert at End",
        "[3] Insert at Position",
        "[4] Delete at Start",
        "[5] Delete at End",
        "[6] Delete at Position",
        "[7] Display",
        "[8] Exit",
        "Enter your choice: "
      ].join("\n");

      var JPG_QUALITY = 0.95;
      var HEADER_H = 35;
      var GUTTER = 22;
      var PAD_L = 6;
      var PAD_R = 12;
      var PAD_T = 4;
      var PAD_B = 8;

      var MONO = '"Cascadia Mono", "Cascadia Code", Consolas, "Courier New", monospace';
      var UI_FONT = '13px "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif';

      var C_PANEL = "#181818";
      var C_BORDER = "#2b2b2b";
      var C_TAB = "#9d9d9d";
      var C_TAB_ON = "#e7e7e7";
      var C_TAB_BG = "#2b2b2b";
      var C_TEXT = "#cccccc";
      var C_ICON = "#c8c8c8";
      var C_DOT = "#8a8a8a";

      function $(id) { return document.getElementById(id); }
      function isMobile() { return window.matchMedia("(max-width: 900px)").matches; }

      var els = {
        tabs: $("tabs"),
        panels: document.querySelectorAll(".panel"),
        tabButtons: document.querySelectorAll(".tab"),

        outputFull: $("outputFull"),
        promptInput: $("promptInput"),

        fontSize: $("fontSize"),
        panelWidth: $("panelWidth"),
        bottomSpace: $("bottomSpace"),
        cropRight: $("cropRight"),
        cursor: $("cursor"),

        fsVal: $("fsVal"),
        pwVal: $("pwVal"),
        bsVal: $("bsVal"),
        crVal: $("crVal"),
        dimInfo: $("dimInfo"),
        lineInfo: $("lineInfo"),
        cropInfo: $("cropInfo"),

        presets: $("presets"),
        dl: $("dl"),
        copyBtn: $("copyBtn"),
        resetBtn: $("resetBtn"),

        settings: $("settings"),
        settingsToggle: $("settingsToggle"),

        canvasWrap: $("canvasWrap"),
        canvasScroll: document.querySelector(".canvas-scroll"),
        cropOverlay: $("cropOverlay"),
        cropLine: $("cropLine"),

        toast: $("toast")
      };

      var canvas = $("termCanvas");
      var ctx = canvas.getContext("2d");
      var meas = document.createElement("canvas").getContext("2d");

      var currentTab = isMobile() ? "preview" : "terminal";

      function applyLayout() {
        var mobile = isMobile();
        for (var i = 0; i < els.tabButtons.length; i++) {
          var t = els.tabButtons[i];
          t.classList.toggle("active", t.dataset.tab === currentTab);
        }
        for (var j = 0; j < els.panels.length; j++) {
          var p = els.panels[j];
          var name = p.dataset.panel;
          if (!mobile && name === "preview") {
            p.classList.add("active");
          } else {
            p.classList.toggle("active", name === currentTab);
          }
        }
      }

      function switchTab(name) {
        if (!isMobile() && name === "preview") return;
        currentTab = name;
        applyLayout();
      }

      window.addEventListener("resize", function () {
        if (!isMobile() && currentTab === "preview") currentTab = "terminal";
        applyLayout();
        // Recompute crop display when the layout breakpoint changes
        updateCanvasDisplay(+els.panelWidth.value, +els.cropRight.value);
        updateCropOverlay(+els.cropRight.value);
      });

      /* ---------- Toast ---------------------------------------------- */
      var toastTimer = null;
      function showToast(msg, kind) {
        els.toast.textContent = msg;
        els.toast.className = "toast show" + (kind ? " " + kind : "");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          els.toast.className = "toast" + (kind ? " " + kind : "");
        }, 1800);
      }

      /* ---------- Text helpers --------------------------------------- */
      function wrapChars(text, maxChars) {
        var out = [];
        var paras = String(text)
          .replace(/\r\n?/g, "\n")
          .replace(/\t/g, "    ")
          .split("\n");
        for (var p = 0; p < paras.length; p++) {
          var para = paras[p];
          if (para.length === 0) { out.push(""); continue; }
          for (var i = 0; i < para.length; i += maxChars) {
            out.push(para.slice(i, i + maxChars));
          }
        }
        return out.length ? out : [""];
      }

      /* ---------- Drawing helpers ------------------------------------ */
      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function drawPlus(cx, cy) {
        var r = 5.5;
        ctx.beginPath();
        ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
        ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
        ctx.stroke();
      }

      function drawChevron(cx, cy, dir) {
        var w = 4.5, h = 2.5;
        var d = dir === "down" ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(cx - w, cy - h * d);
        ctx.lineTo(cx, cy + h * d);
        ctx.lineTo(cx + w, cy - h * d);
        ctx.stroke();
      }

      function drawClose(cx, cy) {
        var r = 4.5;
        ctx.beginPath();
        ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r);
        ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r);
        ctx.stroke();
      }

      function drawHeader(W) {
        ctx.font = UI_FONT;
        ctx.textBaseline = "middle";
        var tabs = [["Problems", false], ["Debug Console", false], ["Terminal", true]];
        var x = 0;
        for (var i = 0; i < tabs.length; i++) {
          var label = tabs[i][0];
          var active = tabs[i][1];
          var tw = ctx.measureText(label).width + 22;
          if (active) {
            ctx.fillStyle = C_TAB_BG;
            roundRect(x + 3, 5, tw - 6, HEADER_H - 10, 5);
            ctx.fill();
          }
          ctx.fillStyle = active ? C_TAB_ON : C_TAB;
          ctx.fillText(label, x + 11, HEADER_H / 2 + 1);
          x += tw;
        }
        var iy = Math.round(HEADER_H / 2);
        ctx.strokeStyle = C_ICON;
        ctx.lineWidth = 1.2;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        var cx = W - 16;
        drawClose(cx, iy);           cx -= 28;
        drawChevron(cx, iy, "up");   cx -= 28;
        drawChevron(cx, iy, "down"); cx -= 28;
        drawPlus(cx, iy);
      }

      /* ---------- Reset button state --------------------------------- */
      function refreshResetButtons() {
        var resets = document.querySelectorAll(".slider-reset");
        for (var i = 0; i < resets.length; i++) {
          var btn = resets[i];
          var targetId = btn.dataset.target;
          var def = +btn.dataset.default;
          var current = +els[targetId].value;
          btn.disabled = (current === def);
        }
      }

      /* ---------- Canvas display mode (mobile crop) ------------------ */
      var CROP_PEEK_FRAC = 0.08;   // how much of the view the cropped peek takes
      var CROP_PEEK_MIN  = 22;     // px — never smaller than this
      var CROP_PEEK_MAX  = 0.22;   // never larger than this fraction of the view

      function updateCanvasDisplay(panelW, cropPct) {
        if (isMobile() && cropPct > 0) {
          els.canvasWrap.classList.add("cropping");

          var avail = els.canvasWrap.clientWidth || els.canvasScroll.clientWidth;
          var peek = Math.round(avail * CROP_PEEK_FRAC);
          if (peek < CROP_PEEK_MIN) peek = CROP_PEEK_MIN;
          if (peek > avail * CROP_PEEK_MAX) peek = Math.round(avail * CROP_PEEK_MAX);

          var visibleFrac = 1 - cropPct / 100;

          // Scale so the uncropped part fills (avail - peek) and `peek` px of the
          // cropped side stays on screen. For small crops that math makes the canvas
          // narrower than the view, so just fit the whole thing instead.
          var w = Math.max((avail - peek) / visibleFrac, avail);

          canvas.style.width = Math.round(w) + "px";
          canvas.style.maxWidth = "none";
        } else {
          els.canvasWrap.classList.remove("cropping");
          canvas.style.width = panelW + "px";
          canvas.style.maxWidth = "";
        }
      }

      /* ---------- Crop marker (desktop + mobile peek) ---------------- */
      function updateCropOverlay(cropPct) {
        if (cropPct <= 0) {
          els.cropOverlay.style.display = "none";
          els.cropLine.style.display = "none";
          return;
        }

        var wrapRect = els.canvasWrap.getBoundingClientRect();
        var canvasRect = canvas.getBoundingClientRect();
        if (!wrapRect.width || !canvasRect.width) {
          els.cropOverlay.style.display = "none";
          els.cropLine.style.display = "none";
          return;
        }

        // Where the crop boundary lands, measured from the right edge of the view.
        var visibleFrac = 1 - cropPct / 100;
        var boundary = (canvasRect.left - wrapRect.left) + canvasRect.width * visibleFrac;
        var fromRight = wrapRect.width - boundary;
        if (fromRight < 0) fromRight = 0;
        if (fromRight > wrapRect.width) fromRight = wrapRect.width;

        els.cropOverlay.style.display = "block";
        els.cropOverlay.style.width = fromRight + "px";
        els.cropLine.style.display = "block";
        els.cropLine.style.right = fromRight + "px";
      }

      /* ---------- Render --------------------------------------------- */
      function render() {
        try {
          var fontSize = +els.fontSize.value;
          var panelW = +els.panelWidth.value;
          var bottomSpace = +els.bottomSpace.value;
          var cropPct = +els.cropRight.value;
          var showCursor = els.cursor.checked;
          var prompt = els.promptInput.value;
          var output = els.outputFull.value;

          els.fsVal.textContent = fontSize + "px";
          els.pwVal.textContent = panelW + "px";
          els.bsVal.textContent = bottomSpace + "px";
          els.crVal.textContent = cropPct + "%";
          els.cropInfo.textContent = cropPct + "%";

          var lineH = Math.round(fontSize * 1.33);
          var bodyFont = fontSize + "px " + MONO;

          meas.font = bodyFont;
          var charW = meas.measureText("M").width || (fontSize * 0.6);
          var textLeft = PAD_L + GUTTER;
          var maxChars = Math.max(10, Math.floor((panelW - textLeft - PAD_R) / charW));

          var raw = prompt.length ? (prompt + "\n" + output) : output;
          var lines = wrapChars(raw, maxChars);

          var cursorLine = lines.length - 1;
          var cursorCol = (lines[cursorLine] || "").length;
          if (cursorCol >= maxChars) { cursorLine++; cursorCol = 0; }

          var bodyLines = Math.max(lines.length, showCursor ? cursorLine + 1 : 0);
          var H = HEADER_H + PAD_T + bodyLines * lineH + PAD_B + bottomSpace;
          if (H < 160) H = 160;

          var S = 2;
          if (panelW * S * H * S > 2.0e8) S = 1;

          canvas.width = Math.round(panelW * S);
          canvas.height = Math.round(H * S);

          ctx.setTransform(S, 0, 0, S, 0, 0);
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.textRendering = "geometricPrecision";

          ctx.fillStyle = C_PANEL;
          ctx.fillRect(0, 0, panelW, H);
          ctx.fillStyle = C_BORDER;
          ctx.fillRect(0, 0, panelW, 1);

          drawHeader(panelW);

          var startY = HEADER_H + PAD_T;

          if (prompt.length > 0 && lines.length > 0) {
            var dotCx = PAD_L + GUTTER / 2 - 2;
            var dotCy = startY + lineH / 2 - 1;
            ctx.beginPath();
            ctx.arc(dotCx, dotCy, 4.5, 0, Math.PI * 2);
            ctx.strokeStyle = C_DOT;
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }

          ctx.font = bodyFont;
          ctx.textBaseline = "middle";
          ctx.fillStyle = C_TEXT;

          for (var i = 0; i < lines.length; i++) {
            if (lines[i]) {
              ctx.fillText(lines[i], textLeft, startY + i * lineH + lineH / 2);
            }
          }

          if (showCursor) {
            var cy = startY + cursorLine * lineH;
            var ch = Math.round(fontSize * 1.15);
            ctx.fillStyle = C_TEXT;
            ctx.fillRect(textLeft + cursorCol * charW, cy + (lineH - ch) / 2, charW, ch);
          }

          // Info
          var visibleW = Math.round(panelW * (1 - cropPct / 100));
          els.dimInfo.textContent = visibleW + " × " + H + " px";
          els.lineInfo.textContent = lines.length;

          // Sizing — must run AFTER canvas.width is set
          updateCanvasDisplay(panelW, cropPct);

          // Reset button states
          refreshResetButtons();

          // Crop marker — next frame so layout settles
          requestAnimationFrame(function () { updateCropOverlay(cropPct); });

          // Preset button highlight
          var presetBtns = els.presets.querySelectorAll(".preset");
          for (var k = 0; k < presetBtns.length; k++) {
            var pw = +presetBtns[k].dataset.w;
            if (pw === panelW) presetBtns[k].classList.add("active");
            else presetBtns[k].classList.remove("active");
          }
        } catch (err) {
          console.error("Render error:", err);
        }
      }

      /* ---------- Export (respects crop) ----------------------------- */
      function buildExportCanvas() {
        var cropPct = +els.cropRight.value;
        var visibleFrac = 1 - cropPct / 100;
        var srcW = canvas.width;
        var srcH = canvas.height;
        var outW = Math.max(1, Math.round(srcW * visibleFrac));

        var tmp = document.createElement("canvas");
        tmp.width = outW;
        tmp.height = srcH;
        var tctx = tmp.getContext("2d");
        tctx.fillStyle = "#181818";
        tctx.fillRect(0, 0, outW, srcH);
        tctx.drawImage(canvas, 0, 0, outW, srcH, 0, 0, outW, srcH);
        return tmp;
      }

      function download() {
        try {
          var tmp = buildExportCanvas();
          var dataUrl = tmp.toDataURL("image/jpeg", JPG_QUALITY);
          var a = document.createElement("a");
          a.href = dataUrl;
          a.download = "snapterm.jpg";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          showToast("Saved as snapterm.jpg", "success");
        } catch (err) {
          console.error(err);
          showToast("Download failed", "error");
        }
      }

      function copyImage() {
        if (!navigator.clipboard || !window.ClipboardItem) {
          showToast("Clipboard not supported", "error");
          return;
        }
        var tmp = buildExportCanvas();
        tmp.toBlob(function (blob) {
          navigator.clipboard.write([new ClipboardItem({ "image/png": blob })])
            .then(function () { showToast("Copied", "success"); })
            .catch(function () { showToast("Copy failed", "error"); });
        }, "image/png");
      }

      function reset() {
        els.promptInput.value = DEFAULT_PROMPT;
        els.outputFull.value = DEFAULT_OUTPUT;
        els.fontSize.value = 14;
        els.panelWidth.value = 1500;
        els.bottomSpace.value = 0;
        els.cropRight.value = 0;
        els.cursor.checked = true;
        render();
        showToast("Settings reset");
      }

      function toggleSettings() {
        els.settings.classList.toggle("open");
      }

      /* ---------- Bind ----------------------------------------------- */
      function bind() {
        els.tabs.addEventListener("click", function (ev) {
          var btn = ev.target.closest(".tab");
          if (btn) switchTab(btn.dataset.tab);
        });

        els.outputFull.addEventListener("input", render);
        els.promptInput.addEventListener("input", render);

        var inputs = [els.fontSize, els.panelWidth, els.bottomSpace, els.cropRight, els.cursor];
        for (var i = 0; i < inputs.length; i++) {
          inputs[i].addEventListener("input", render);
          inputs[i].addEventListener("change", render);
        }

        els.presets.addEventListener("click", function (ev) {
          var target = ev.target.closest(".preset");
          if (!target) return;
          els.panelWidth.value = target.dataset.w;
          render();
        });

        // Individual slider reset buttons
        document.addEventListener("click", function (ev) {
          var btn = ev.target.closest(".slider-reset");
          if (!btn || btn.disabled) return;
          var targetId = btn.dataset.target;
          var def = btn.dataset.default;
          els[targetId].value = def;
          render();
        });

        els.dl.addEventListener("click", download);
        els.copyBtn.addEventListener("click", copyImage);
        els.resetBtn.addEventListener("click", reset);

        els.settingsToggle.addEventListener("click", toggleSettings);

        document.addEventListener("keydown", function (ev) {
          if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") {
            ev.preventDefault();
            download();
          }
        });
      }

      /* ---------- Init ----------------------------------------------- */
      function init() {
        els.promptInput.value = DEFAULT_PROMPT;
        els.outputFull.value = DEFAULT_OUTPUT;
        bind();
        applyLayout();
        render();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
