<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <meta name="color-scheme" content="dark" />
  <title>SnapTerm — VS Code terminal screenshots</title>
  <meta name="description" content="Generate pixel-accurate VS Code terminal screenshots from pasted text." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <div class="stage-bg"></div>
  <div class="dot-grid"></div>

  <div class="app">

    <!-- ===================== TOPBAR ===================== -->
    <nav class="topbar">
      <div class="brand">SNAPTERM</div>

      <div class="nav-links" id="tabs">
        <button class="nav-item active" data-view="preview" type="button">Preview</button>
        <button class="nav-item" data-view="output" type="button">Output</button>
        <button class="nav-item" data-view="prompt" type="button">Prompt</button>
      </div>

      <div class="dots"><span></span><span></span><span></span></div>
    </nav>

    <!-- ===================== STAGE ===================== -->
    <main class="stage">

      <!-- ---------- LEFT: editor column (unchanged) ---------- -->
      <div class="col-editor" id="colEditor">

        <div class="hero">
          <h1>TERMINAL SNAPSHOTS<span>WHAT YOU PASTE</span></h1>
        </div>

        <section class="card card-output left-editor-card">
          <div class="label">Terminal Output</div>
          <textarea id="outputFull" spellcheck="false" placeholder="Paste your program output…"></textarea>
        </section>

        <section class="card card-prompt left-editor-card">
          <div class="label">Prompt / Command Line</div>
          <input type="text" id="promptInput" spellcheck="false" />
        </section>

        <section class="card card-controls">
          <div class="label">Render Controls</div>

          <!-- Font size -->
          <div class="ctl">
            <div class="ctl-head">
              <span class="ctl-name">Font size</span>
              <div class="ctl-right">
                <span class="val" id="fsVal">14px</span>
                <button class="rst" type="button" title="Reset font size" data-target="fontSize" data-default="14">
                  <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path
                      d="M8 3a5 5 0 1 0 4.546 2.914.75.75 0 0 1 1.302-.746A6.5 6.5 0 1 1 8 1.5V.75a.25.25 0 0 1 .41-.19l2.5 2.5a.25.25 0 0 1 0 .38l-2.5 2.5A.25.25 0 0 1 8 5.75V3Z" />
                  </svg>
                </button>
              </div>
            </div>
            <input type="range" id="fontSize" min="10" max="22" step="1" value="14" />
          </div>

          <!-- Panel width -->
          <div class="ctl">
            <div class="ctl-head">
              <span class="ctl-name">Panel width</span>
              <div class="ctl-right">
                <span class="val" id="pwVal">1500px</span>
                <button class="rst" type="button" title="Reset panel width" data-target="panelWidth"
                  data-default="1500">
                  <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path
                      d="M8 3a5 5 0 1 0 4.546 2.914.75.75 0 0 1 1.302-.746A6.5 6.5 0 1 1 8 1.5V.75a.25.25 0 0 1 .41-.19l2.5 2.5a.25.25 0 0 1 0 .38l-2.5 2.5A.25.25 0 0 1 8 5.75V3Z" />
                  </svg>
                </button>
              </div>
            </div>
            <input type="range" id="panelWidth" min="700" max="2600" step="10" value="1500" />
            <div class="presets" id="presets">
              <button class="preset" data-w="1000" type="button">1080p</button>
              <button class="preset" data-w="1500" type="button">1500</button>
              <button class="preset" data-w="1920" type="button">1920</button>
              <button class="preset" data-w="2400" type="button">Wide</button>
            </div>
          </div>

          <!-- Bottom space -->
          <div class="ctl">
            <div class="ctl-head">
              <span class="ctl-name">Bottom space</span>
              <div class="ctl-right">
                <span class="val" id="bsVal">0px</span>
                <button class="rst" type="button" title="Reset bottom space" data-target="bottomSpace" data-default="0">
                  <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path
                      d="M8 3a5 5 0 1 0 4.546 2.914.75.75 0 0 1 1.302-.746A6.5 6.5 0 1 1 8 1.5V.75a.25.25 0 0 1 .41-.19l2.5 2.5a.25.25 0 0 1 0 .38l-2.5 2.5A.25.25 0 0 1 8 5.75V3Z" />
                  </svg>
                </button>
              </div>
            </div>
            <input type="range" id="bottomSpace" min="0" max="800" step="10" value="0" />
          </div>

          <!-- Crop from right -->
          <div class="ctl">
            <div class="ctl-head">
              <span class="ctl-name">Crop from right</span>
              <div class="ctl-right">
                <span class="val" id="crVal">0%</span>
                <button class="rst" type="button" title="Reset crop" data-target="cropRight" data-default="0">
                  <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path
                      d="M8 3a5 5 0 1 0 4.546 2.914.75.75 0 0 1 1.302-.746A6.5 6.5 0 1 1 8 1.5V.75a.25.25 0 0 1 .41-.19l2.5 2.5a.25.25 0 0 1 0 .38l-2.5 2.5A.25.25 0 0 1 8 5.75V3Z" />
                  </svg>
                </button>
              </div>
            </div>
            <input type="range" id="cropRight" min="0" max="95" step="5" value="0" />
          </div>

          <!-- Cursor -->
          <div class="ctl" style="margin-top:4px">
            <label class="check">
              <input type="checkbox" id="cursor" checked />
              <span>Show cursor</span>
            </label>
          </div>
        </section>
      </div>

      <!-- ---------- RIGHT: switchable view + pinned bottom rows ---------- -->
      <div class="col-preview" id="colPreview">

        <!-- Switchable content area -->
        <div class="view-stack">

          <!-- Preview view -->
          <div class="view active" data-view="preview">
            <div class="preview-stage">
              <div class="preview-scroll">
                <div class="canvas-wrap" id="canvasWrap">
                  <canvas id="termCanvas"></canvas>
                  <div class="crop-overlay" id="cropOverlay"></div>
                  <div class="crop-line" id="cropLine"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Output view -->
          <div class="view" data-view="output">
            <section class="card card-output">
              <div class="label">Terminal Output — Focus</div>
              <textarea id="outputFullRight" spellcheck="false" placeholder="Paste your program output…"></textarea>
            </section>
          </div>

          <!-- Prompt view -->
          <div class="view" data-view="prompt">
            <section class="card card-prompt">
              <div class="label">Prompt / Command Line — Focus</div>
              <input type="text" id="promptInputRight" spellcheck="false" />
            </section>
          </div>

        </div>

        <!-- Pinned info pills (constant across all tabs) -->
        <div class="info-row">
          <div class="info-pill"><span>Size</span><b id="dimInfo">—</b></div>
          <div class="info-pill"><span>Lines</span><b id="lineInfo">—</b></div>
          <div class="info-pill"><span>Crop</span><b id="cropInfo">0%</b></div>
          <div class="info-pill"><span>Format</span><b>JPEG · 95%</b></div>
        </div>

        <!-- Pinned actions (constant across all tabs) -->
        <div class="actions">
          <button class="btn btn-solid" id="dl" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 12.5 3.5 8l1.06-1.06L7.25 9.63V1.5h1.5v8.13l2.69-2.69L12.5 8 8 12.5Zm-5 1.5h10v1H3v-1Z" />
            </svg>
            Download JPG
          </button>
          <button class="btn btn-ghost" id="copyBtn" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M10 1H3a1 1 0 0 0-1 1v8h1.5V2.5H10V1Zm2 2.5H6a1 1 0 0 0-1 1V14a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.5a1 1 0 0 0-1-1Zm0 10.5H6V4.5h6V14Z" />
            </svg>
            <span class="txt">Copy</span>
          </button>
          <button class="btn btn-ghost" id="resetBtn" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M8 3a5 5 0 1 0 4.546 2.914.75.75 0 0 1 1.302-.746A6.5 6.5 0 1 1 8 1.5V.75a.25.25 0 0 1 .41-.19l2.5 2.5a.25.25 0 0 1 0 .38l-2.5 2.5A.25.25 0 0 1 8 5.75V3Z" />
            </svg>
            <span class="txt">Reset</span>
          </button>
        </div>

      </div>
    </main>

    <!-- ===================== STATUS BAR ===================== -->
    <footer class="statusbar">
      <div class="status-left">
        <span class="pulse-dot"></span>
        <span class="status-txt">Live Preview</span>
        <span class="status-sep">·</span>
        <span class="status-ver">v1.0.0</span>
      </div>
      <div class="status-right">© 2026 SnapTerm</div>
    </footer>

  </div>

  <div class="toast" id="toast"></div>

  <script src="js/app.js"></script>
</body>

</html>
